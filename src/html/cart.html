<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEST SHOP - My Cart</title>
    <link rel="stylesheet" href="../../dist/css/main.css" />
  </head>
  <body class="page-cart">
    <!-- ======================= HEADER ======================= -->

    <header>
    
    </header>
          <!-- ======================= MAIN  ======================= -->

    <main>
      <!-- ======================= BANNER  ======================= -->

      <div class="banner banner--page-title">
        <img src="../assets/images/MyCart_banner.jpg" alt="Luggage packing" />
        <div class="banner__content">
          <h1 class="banner__title">My Cart</h1>
          <p>
            Duis vestibulum elit vel neque pharetra vulputate. Duis rutrum non
            risus in imperdiet.
          </p>
        </div>
      </div>
<section class="cart-main-container">
      <div class="cart-outer">
        <div class="cart-header">
          <div>Image</div>
          <div>Product Name</div>
          <div>Price</div>
          <div>Quantity</div>
          <div>Total</div>
          <div>Delete</div>
        </div>
        <div class="cart-container"></div>
      </div>
      <div class="cart-lower_container">
        <div class="cart-actions">
          <div class="button-primary btn-continue">Continue Shopping</div>
          <div class="button-primary btn-clear">Clear Shopping Cart</div>
        </div>
        <div class="summary_container">
        <div class="summary">
          <div class="summary-line">
            <span>Sub Total</span>
            <span id="subtotal"></span>
          </div>
          <div class="summary-line discount">
            <span>Discount</span> <span id="discount-value"></span>
          </div>
          <div class="summary-line">
            <span>Shipping</span>
            <span></span>
          </div>
          <div class="summary-line total">
            <span>Total</span>
            <span id="total"></span>
          </div>
          <div class="button-primary btn-checkout">Checkout</div>
        </div>
        </div>
      </section>
    </main>

    
    <!-- ======================= FOOTER ======================= -->
    <footer>    </footer>
   <!-- ======================= SCRIPTS ======================= -->

    <script src="../js/cart-badge.js"></script>
    <script type="module">
      import { initCartPage } from "../js/cart.js";
      document.addEventListener("DOMContentLoaded", initCartPage);
    </script>
    <script type="module">
  import { headerTemplate, footerTemplate } from "../js/components.js";

  // Selects the first <header> and <footer> tags on the page
  const headerTag = document.querySelector("header");
  const footerTag = document.querySelector("footer");

  if (headerTag) headerTag.innerHTML = headerTemplate;
  if (footerTag) footerTag.innerHTML = footerTemplate;
</script>
  </body>
</html>
