<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEST SHOP - My Cart</title>
    <link rel="stylesheet" href="../scss/main.css" />
  </head>
  <body class="page-cart">
    <header class="site-header">...</header>

    <main>
      <section
        class="hero-banner hero-banner--page-title"
        style="background-image: url('../assets/images/MyCart_banner.jpg')"
      >
        <div class="container hero-banner__content">
          <h1 class="hero-banner__title">My Cart</h1>
        </div>
      </section>

      <section class="section section--cart-details">
        <div class="container cart-layout">
          <div class="cart-layout__items">
            <div class="cart-list__header">
              <span class="header__image">IMAGE</span>
              <span class="header__product">PRODUCT NAME</span>
              <span class="header__price">PRICE</span>
              <span class="header__quantity">QUANTITY</span>
              <span class="header__total">TOTAL</span>
              <span class="header__delete">DELETE</span>
            </div>

            <article class="cart-item-row">
              <div class="cart-item-row__image-wrapper">
                <!-- <img
                  src="../assets/images/"
                  alt="Nomad Haven"
                /> -->
              </div>
              <div class="cart-item-row__name">Nomad Haven</div>
              <div class="cart-item-row__price">$250</div>
              <div class="cart-item-row__quantity">
                <button class="quantity-selector__btn">-</button>
                <input type="text" value="1" class="quantity-selector__input" />
                <button class="quantity-selector__btn">+</button>
              </div>
              <div class="cart-item-row__total">$250</div>
              <div class="cart-item-row__delete">
                <button class="button button--icon">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </article>

            <div class="cart-actions">
              <button class="button button--primary">Continue Shopping</button>
              <button class="button button--outline">
                Clear Shopping Cart
              </button>
            </div>
          </div>

          <aside class="cart-layout__summary">
            <div class="order-summary">
              <div class="order-summary__line">
                <span>Sub Total</span><span>$2140</span>
              </div>
              <div class="order-summary__line">
                <span>Shipping</span><span>$30</span>
              </div>
              <div class="order-summary__line order-summary__line--total">
                <span>Total</span><span>$2170</span>
              </div>
              <button class="button button--primary">Checkout</button>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <footer class="site-footer">...</footer>
  </body>
</html>
