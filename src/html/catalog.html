<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEST SHOP - Catalog</title>
    <link rel="stylesheet" href="../../dist/css/main.css" />
  </head>
  <body class="page-catalog">
    <!-- ======================= HEADER ======================= -->

    <header></header>
    <!-- ======================= MAIN ======================= -->

    <main>
      <section class="catalog-layout">
        <div class="catalog-layout__main-content">
          <div class="catalog-meta">
            <p class="results-count">Showing 0 of 0 results</p>
          </div>
          <div class="field">
            <select class="field__input field__select">
              <option class="disabled_dropdown" value="" disabled selected>
                Default Sorting
              </option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="popularity">Most Popular</option>
              <option value="rating">Highest Rated</option>
            </select>
          </div>

          <!-- ======================= Products  ======================= -->

          <div id="product-grid" class="product-grid"></div>

          <!-- ======================= Pagination  ======================= -->
          <div class="pagination">
            <button id="prev-page" class="button-nav">Previous</button>
            <span id="page-indicator"></span>
            <button id="next-page" class="button-nav">Next</button>
          </div>
        </div>
        <!-- ======================= Best Sets ======================= -->

        <div class="best-sets-sidebar">
          <!-- ======================= Search  ======================= -->
          <div class="search-wrapper">
            <label for="searchModels" class="sr-only">Search Models</label>
            <input
              type="text"
              placeholder="Search Models"
              class="search-input"
              id="searchModels"
            />
            <span class="search-icon">
              <img src="../assets/images/magnifier.svg" alt="magnifier" />
            </span>
          </div>
          <h5 class="best-sets-sidebar__title">Top Best Sets</h5>
          <ul class="best-sets-list" id="best-sets-list"></ul>
        </div>
      </section>
    </main>
    <!-- ======================= FOOTER ======================= -->
    <footer></footer>
    <script src="../js/cart-badge.js"></script>
    <script type="module" src="../js/catalog.js"></script>
    <script type="module">
      import { headerTemplate, footerTemplate } from "../js/components.js";

      // Selects the first <header> and <footer> tags on the page
      const headerTag = document.querySelector("header");
      const footerTag = document.querySelector("footer");

      if (headerTag) headerTag.innerHTML = headerTemplate;
      if (footerTag) footerTag.innerHTML = footerTemplate;
    </script>
  </body>
</html>
