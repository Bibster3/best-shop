<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEST SHOP - Catalog</title>
    <link rel="stylesheet" href="../scss/main.css" />
  </head>
  <body class="page-catalog">
    <main>
      <section class="catalog-layout">
        <aside class="catalog-layout__sidebar">
          <div class="filter-controls">
            <h3 class="filter-controls__title">Filter Products</h3>
            <div class="filter-controls__grid">
              <div class="field">
                <label class="field__label">Size</label>
                <select class="field__input field__select">
                  ...
                </select>
              </div>
              <div class="field">
                <label class="field__label">Color</label>
                <select class="field__input field__select">
                  ...
                </select>
              </div>
            </div>
            <div class="filter-controls__action-bar">
              <button class="button button--primary">Clear Filters</button>
              <button class="button button--outline">Hide Filters</button>
            </div>
          </div>
        </aside>

        <div class="catalog-layout__main-content">
          <div class="product-grid">
            <article class="product-card">...</article>
            <article class="product-card">...</article>
            <article class="product-card">...</article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
